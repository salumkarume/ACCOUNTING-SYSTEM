<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weka Password Mpya - HAWAII ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>body{justify-content:center;align-items:center;background:#09283f;padding:16px}.box{max-width:440px;width:100%;background:#fff;padding:28px;border-radius:12px}.box h2{text-align:center;color:#09283f}.box p{color:#64748b;font-size:14px}.box button{width:100%;margin-top:12px}</style></head><body><div class="box"><h2>Weka Password Mpya</h2><p>Password mpya iwe na angalau herufi 9.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="POST"><label>Password mpya</label><input type="password" name="new_password" minlength="9" autocomplete="new-password" required><label>Rudia password mpya</label><input type="password" name="confirm_password" minlength="9" autocomplete="new-password" required><button type="submit">Hifadhi Password Mpya</button></form></div></body></html>
