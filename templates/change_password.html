{% extends "base.html" %}
{% block content %}
<div class="topbar"><h1>Badili Password</h1></div>
<div class="card" style="max-width:620px">
  <h3>Badili password ya akaunti yako</h3>
  <p>Kwa usalama, weka password yako ya sasa. Password mpya iwe na angalau herufi 9.</p>
  <form method="POST" class="form-grid">
    <div style="grid-column:1/-1"><label>Password ya sasa</label><input type="password" name="current_password" autocomplete="current-password" required></div>
    <div><label>Password mpya</label><input type="password" name="new_password" minlength="9" autocomplete="new-password" required></div>
    <div><label>Rudia password mpya</label><input type="password" name="confirm_password" minlength="9" autocomplete="new-password" required></div>
    <div><button type="submit" class="btn-accent">Hifadhi Password Mpya</button></div>
  </form>
</div>
{% endblock %}
